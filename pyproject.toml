[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-confirm"
version = "0.2.0"
description = "An MCP server whose confirmation cannot be replayed against a different call"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Leslie Kadenge" }]
keywords = ["mcp", "elicitation", "mrtr", "security", "confirmation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    # Multi Round-Trip Requests landed in the 2026-07-28 specification; the
    # InputRequiredResult and ElicitRequest types this server returns do not
    # exist in earlier SDKs, so an older mcp is a hard failure rather than a
    # degraded mode.
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "ruff>=0.6"]

[project.scripts]
mcp-confirm = "mcp_confirm.server:main"

[project.urls]
Homepage = "https://github.com/les-k/mcp-confirm"
Issues = "https://github.com/les-k/mcp-confirm/issues"

[tool.setuptools.packages.find]
where = ["src"]

# No JavaScript ships here, so there are no source maps to leak. The exclusion
# is declared anyway: it costs nothing, and arguing with a supply-chain
# checklist is a poor use of an afternoon.
[tool.setuptools.exclude-package-data]
"*" = ["*.map", "*.pyc", "*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["mcp_confirm"]
branch = true
